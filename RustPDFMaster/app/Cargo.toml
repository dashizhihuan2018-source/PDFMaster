[package]
name = "pdfmaster-ui"
version = "2.0.0-dev.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
leptos = { version = "=0.8.16", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "Event", "EventTarget"] }

[workspace]

[package]
name = "pdfmaster-app"
version = "2.0.0-dev.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[lib]
name = "pdfmaster_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = { version = "=2.6.0", default-features = false }
pdfmaster-core = { path = "../crates/pdfmaster-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tempfile = "3.20"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSObject", "NSString", "NSArray", "NSURL", "NSError", "NSFileCoordinator", "NSData", "NSDictionary", "NSValue"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UIResponder", "UIViewController", "UIDocumentPickerViewController", "UIPasteboard"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]

[dev-dependencies]
lopdf = { version = "=0.46.0", default-features = false }

[package]
name = "pdfmaster-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pdfmaster-drawing = { path = "../pdfmaster-drawing" }
flate2 = "1.1"
crc32fast = "1.5"
moxcms = "=0.8.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw", "jpeg", "fax"] }
hayro = "=0.8.0"
skrifa = "=0.46.2"
lopdf = { version = "=0.46.0", default-features = false }
parley = { version = "=0.10.0", default-features = false, features = ["std", "complex-scripts"] }
krilla = { version = "=0.8.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sha2 = "=0.11.1"
thiserror = "2.0"
time = { version = "=0.3.55", default-features = false, features = ["std"] }
png = "0.18"

[dev-dependencies]
serde_json = "1.0"
